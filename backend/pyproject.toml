[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jugo"
version = "0.1.0"
description = "ATS Jugo - Applicant Tracking System backend"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "ATS Jugo Team" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "arq>=0.26",
    "pgvector>=0.3",
    "structlog>=24.1",
    "pyjwt>=2.9",
    "cryptography>=43",
    "openai>=1.40",
    "aiobotocore>=2.13",
    "jinja2>=3.1",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "testcontainers>=4.7",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
jugo-api = "jugo.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Security",
    "fastapi.params.Depends",
    "fastapi.params.Query",
    "fastapi.params.Path",
    "require_permission",
    "jugo.core.security.require_permission",
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
"alembic/env.py" = ["E402"]

[tool.mypy]
strict = true
plugins = []
python_version = "3.12"
files = ["src/jugo"]

[[tool.mypy.overrides]]
module = [
    "aiobotocore.*",
    "botocore.*",
    "arq.*",
    "pdfplumber.*",
    "docx.*",
    "pgvector.*",
    "structlog.*",
    "redis.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
