name: jugo-prod

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes: ["redis-data:/data"]
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes: ["minio-data:/data"]
    restart: unless-stopped

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    command: ["--model-id", "${EMBEDDING_MODEL:-BAAI/bge-m3}"]
    restart: unless-stopped

  backend:
    build: { context: ../backend }
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      AI_PROVIDER: ${AI_PROVIDER:-yandex}
      YANDEX_API_KEY: ${YANDEX_API_KEY}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID}
      TEI_URL: http://tei:80
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      JWT_SECRET: ${JWT_SECRET}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY}
      APP_ENV: prod
    command: ["uvicorn", "jugo.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  ai-worker:
    build: { context: ../backend }
    command: ["python", "-m", "jugo.jobs.worker", "--pool", "ai"]
    environment: { DATABASE_URL: ${DATABASE_URL}, REDIS_URL: ${REDIS_URL}, AI_PROVIDER: ${AI_PROVIDER:-yandex} }
    depends_on: [postgres, redis]
    restart: unless-stopped

  frontend:
    build: { context: ../frontend }
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["3025:3025"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [backend, frontend]
    restart: unless-stopped

volumes:
  pg-data:
  redis-data:
  minio-data:
  caddy-data:
